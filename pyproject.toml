[project]
name = "llama2c-gradformer"
version = "0.1.0"
description = "Reproducible llama2.c baseline and Gradformer experiments"
requires-python = ">=3.11"
dependencies = [
    "torch==2.9.1",
    "numpy>=1.26",
    "sentencepiece==0.2.1",
    "wandb==0.26.1",
    "requests>=2.32",
    "tqdm>=4.67",
]

[dependency-groups]
dev = ["pytest==8.4.2", "matplotlib==3.10.7"]
local-ce = [
    "cut-cross-entropy",
]

[project.optional-dependencies]
gpu = ["torch==2.9.1"]
cpu = ["torch==2.9.1"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
cut-cross-entropy = { git = "https://github.com/apple-aiml-research/ml-cross-entropy.git", rev = "3de376c106a1916bc5e1b619f9c77c87a461ee1c" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
